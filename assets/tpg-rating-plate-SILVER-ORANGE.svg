<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 65" width="100mm" height="65mm" role="img" aria-label="Pack Guys Automation rating / test plate — silver finish">
  <!-- ============================================================
       TPG RATING / TEST PLATE  — SILVER FINISH (verified plate)
       Physical: 100 x 65 x 1.0mm brushed / clear-anodized 5052 aluminium
       (or brushed 316 stainless). Marks = laser-etch + BLACK infill
       (or laser anneal on SS). Dark art on a bright metal ground —
       the inverse of the black-anodized plate; same geometry & content.
       4x O3.2 rivets + VHB 4941 gasket. Mount on a FIXED FRAME of the
       electrical enclosure (never a door — IEC 60204-1).
       WORD DISCIPLINE: RATING / TEST PLATE. No CERTIFIED / CE / GMP /
       NRTL mark. Safe words only: TESTED, SN-MATCHED, ON FILM, ON FILE,
       STOCKED, POSTED, SERIALIZED.
       Min cap 2.2mm  ->  no text below font-size 3.1 (cap ~2.22mm).
       Brush direction = horizontal. Etch depth 0.05-0.08mm, infill matte black.
       !! OUTLINE ALL TEXT BEFORE ETCH !!
       ============================================================ -->
  <defs>
    <!-- brushed-silver ground: soft horizontal sheen, no gimmick -->
    <linearGradient id="brush" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#E9ECEF"/>
      <stop offset="0.45" stop-color="#CDD2D7"/>
      <stop offset="0.55" stop-color="#C6CBD1"/>
      <stop offset="1"    stop-color="#DDE1E5"/>
    </linearGradient>
  </defs>
  <rect width="100" height="65" fill="url(#brush)"/>
  <!-- faint machined edge bevel -->
  <rect x="0.4" y="0.4" width="99.2" height="64.2" fill="none" stroke="#AEB4BA" stroke-width="0.4"/>
  <g fill="#161616" stroke="#161616">
    <!-- corner rivets O3.2 (centres 6mm from edges) -->
    <g fill="none" stroke-width="0.3">
      <circle cx="6"  cy="6"  r="1.6"/><circle cx="94" cy="6"  r="1.6"/>
      <circle cx="6"  cy="59" r="1.6"/><circle cx="94" cy="59" r="1.6"/>
    </g>
    <!-- header -->
    <text x="8.2" y="9" font-family="Archivo, Arial, sans-serif" font-weight="700"
          font-size="5.5" letter-spacing="0.1" stroke="none" fill="#C8512B">TPG.</text>
    <text x="91.8" y="8.4" text-anchor="end"
          font-family="'IBM Plex Mono', monospace" font-weight="600"
          font-size="3.3" letter-spacing="0.15" stroke="none">RATING / TEST PLATE</text>
    <!-- rule 1 -->
    <line x1="8" y1="11.4" x2="92" y2="11.4" stroke-width="0.3"/>
    <!-- MODEL (hero, cap ~6mm) -->
    <text x="8" y="16.4" font-family="'IBM Plex Mono', monospace" font-weight="500"
          font-size="3.1" letter-spacing="0.2" stroke="none">MODEL</text>
    <text x="8" y="25.2" font-family="Archivo, Arial, sans-serif" font-weight="700"
          font-size="8.5" letter-spacing="0.1" stroke="none">TPG-VC210</text>
    <!-- family glyph slot (VC = vape-cart fill/cap) -->
    <rect x="77.5" y="13.5" width="14.5" height="12.5" fill="none" stroke-width="0.3"/>
    <text x="84.75" y="21.2" text-anchor="middle" font-family="Archivo, Arial, sans-serif"
          font-weight="700" font-size="5" stroke="none">VC</text>
    <text x="84.75" y="24.6" text-anchor="middle" font-family="'IBM Plex Mono', monospace"
          font-weight="500" font-size="1.9" stroke="none">FAMILY</text>
    <!-- SERIAL (hyphen serial, on metal) -->
    <text x="8" y="30.6" font-family="'IBM Plex Mono', monospace" font-weight="500"
          font-size="3.1" letter-spacing="0.2" stroke="none">SERIAL</text>
    <text x="24" y="30.9" font-family="'IBM Plex Mono', monospace" font-weight="600"
          font-size="4.4" letter-spacing="0.3" stroke="none">26-0042</text>
    <!-- rule 2 -->
    <line x1="8" y1="33.4" x2="92" y2="33.4" stroke-width="0.3"/>
    <!-- param grid (two columns) -->
    <g font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="3.1" stroke="none">
      <text x="8"  y="38.4">INPUT    220V~ 1PH</text>
      <text x="8"  y="43.4">FREQ     60 Hz</text>
      <text x="8"  y="48.4">CURRENT  6.0 A</text>
      <text x="8"  y="53.4">POWER    1.1 kW</text>
      <text x="54" y="38.4">NET WT   48 kg</text>
      <text x="54" y="43.4">AIR      0.6 MPa</text>
      <text x="54" y="48.4">YEAR     2026</text>
      <text x="54" y="53.4">ORIGIN   ASSY CN</text>
    </g>
    <!-- rule 3 -->
    <line x1="8" y1="55.8" x2="92" y2="55.8" stroke-width="0.3"/>
    <!-- footer: attestations (safe words only) + LA CHECKED stamp -->
    <text x="8.2" y="60.4" font-family="'IBM Plex Mono', monospace" font-weight="500"
          font-size="3.0" letter-spacing="0.05" stroke="none">SN-MATCHED &#183; FAT 2026-07-15</text>
    <rect x="61" y="57.2" width="30" height="5.2" fill="none" stroke="#C8512B" stroke-width="0.45"/>
    <text x="76" y="60.9" text-anchor="middle" font-family="'IBM Plex Mono', monospace"
          font-weight="700" font-size="3.1" letter-spacing="0.05" stroke="none" fill="#C8512B">LA CHECKED</text>
  </g>
</svg>
